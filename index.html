<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRO 아랍어 웹페이지 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
:root{--green:#123D2B;--gold:#E6C77A;--sand:#EFE6D6;--ink:#16201B;--muted:#5E6A62}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sand);color:var(--ink);font-family:"Noto Sans KR",sans-serif;display:grid;place-items:center;padding:40px 16px}
main{max-width:860px;width:100%}
img{height:44px;width:auto}
h1{font-size:clamp(1.6rem,4vw,2.3rem);margin:22px 0 6px}
p{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px}
a.card{display:grid;gap:8px;text-decoration:none;color:inherit;background:#FAF6EE;border:1px solid rgba(22,32,27,.12);border-radius:20px;padding:28px;transition:transform .25s,box-shadow .25s}
a.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(18,61,43,.5)}
a.card.b{background:var(--green);color:var(--sand)}
a.card.b p{color:rgba(239,230,214,.75)}
.k{font-size:.8rem;font-weight:600;color:#9A7330}
a.card.b .k{color:var(--gold)}
h2{margin:0;font-size:1.35rem}
.ar{font-family:"Alexandria",sans-serif;direction:rtl;font-size:1.05rem}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <img src="assets/logo-dark.png" alt="IRo+">
  <h1>이로성형외과 아랍어 웹페이지 시안</h1>
  <p>걸프 지역(UAE·사우디) 환자 대상 · 시안 2종</p>
  <div class="grid">
    <a class="card" href="ar-signature/">
      <span class="k">시안 A · Signature Editorial</span>
      <h2>이로 + 커스텀피부과 레퍼런스</h2>
      <span class="ar">جمالٌ يدوم نفعُه</span>
      <p>아이보리·골드 톤, 원장 1인 책임 진료 중심의 에디토리얼 구성</p>
    </a>
    <a class="card b" href="ar-journey/">
      <span class="k">시안 B · Medical Journey</span>
      <h2>아이디병원 아랍어 사이트 레퍼런스</h2>
      <span class="ar">رحلتكم العلاجية في سيول</span>
      <p>딥그린·골드 톤, 상담부터 귀국 후 관리까지 치료 여정 중심 구성</p>
    </a>
  </div>
</main>
</body>
</html>
